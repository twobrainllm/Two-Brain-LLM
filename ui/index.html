<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two-Brain Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='3' y='3' width='34' height='34' rx='10' fill='%238A8A8A' opacity='.25'/%3E%3Crect x='7' y='7' width='26' height='26' rx='7' fill='%238A8A8A'/%3E%3Crect x='13' y='17' width='5' height='9' rx='2.5' fill='%23111318'/%3E%3Crect x='22' y='17' width='5' height='9' rx='2.5' fill='%23111318'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>New chat</span>
      </button>
    </div>

    <div class="sidebar-search">
      <svg class="search-icon" viewBox="0 0 20 20" width="15" height="15" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l-3.6-3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search-input" type="text" placeholder="Search chats..." autocomplete="off" />
    </div>

    <nav class="chat-list" id="chat-list" aria-label="Chat history"></nav>

    <div class="sidebar-footer">
      <!-- Which on-device model answers. Populated from GET /models, which
           lists only what is actually installed. Hidden entirely when the
           backend is offline or has nothing to choose between. -->
      <div class="model-picker" id="model-picker" hidden>
        <span class="brain-toggle-label">Local model</span>
        <select id="model-select"></select>
        <span class="model-detail" id="model-detail"></span>
      </div>

      <!-- The backend-status box that used to live here is gone: connection
           state now shows in the empty-state hint, where it is read once at the
           start of a session rather than sitting in the corner permanently. -->
      <div class="brain-toggle" id="brain-toggle-wrap" title="Only used if the API is unreachable — see ui/README.md.">
        <span class="brain-toggle-label" id="brain-toggle-label">Preview tier (if offline)</span>
        <div class="segmented" id="brain-toggle" role="radiogroup" aria-label="Offline preview tier">
          <button class="segment active" data-tier="local" role="radio" aria-checked="true" type="button">Local</button>
          <button class="segment" data-tier="cloud" role="radio" aria-checked="false" type="button">Cloud</button>
        </div>
      </div>

      <div class="expression-preview" id="expression-preview-wrap" title="Demo control — triggers a one-off expression, see ui/README.md">
        <span class="brain-toggle-label">Preview expression</span>
        <div id="expr-buttons">
          <div class="expr-row">
            <button type="button" data-expr="happy">Happy</button>
            <button type="button" data-expr="surprised">Surprised</button>
            <button type="button" data-expr="wink">Wink</button>
          </div>

          <div class="expr-row-label">Look</div>
          <div class="expr-row">
            <button type="button" data-expr="look-left">←</button>
            <button type="button" data-expr="look-right">→</button>
            <button type="button" data-expr="look-up">↑</button>
            <button type="button" data-expr="look-down">↓</button>
          </div>

          <div class="expr-row-label">Look + shrink</div>
          <div class="expr-row">
            <button type="button" data-expr="shrink-look-left">←</button>
            <button type="button" data-expr="shrink-look-right">→</button>
            <button type="button" data-expr="shrink-look-up">↑</button>
            <button type="button" data-expr="shrink-look-down">↓</button>
          </div>

          <div class="expr-row-label">Look + expand</div>
          <div class="expr-row">
            <button type="button" data-expr="expand-look-left">←</button>
            <button type="button" data-expr="expand-look-right">→</button>
            <button type="button" data-expr="expand-look-up">↑</button>
            <button type="button" data-expr="expand-look-down">↓</button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <span class="main-title">Two-Brain Chat</span>

      <div class="profiler" id="profiler">
        <button
          type="button"
          class="profiler-pill"
          id="profiler-pill"
          aria-expanded="false"
          aria-label="Query profiler"
          title="Live: the real RouteDecision from /route. Falls back to formulas ported from the router (see ui/README.md) if the API is unreachable."
        >
          <span class="profiler-dot" id="profiler-dot" data-tier="local"></span>
          <span class="profiler-summary" id="profiler-summary">Profiler</span>
        </button>

        <div class="profiler-card" id="profiler-card">
          <div class="profiler-card-row profiler-card-header">
            <span class="profiler-dot" id="profiler-card-dot" data-tier="local"></span>
            <span class="profiler-card-tier" id="profiler-card-tier">—</span>
          </div>

          <div class="profiler-field">
            <div class="profiler-field-label">
              <span>Difficulty</span>
              <span id="profiler-difficulty-value">—</span>
            </div>
            <div class="profiler-gauge">
              <div class="profiler-gauge-threshold"></div>
              <div class="profiler-gauge-fill" id="profiler-gauge-fill"></div>
            </div>
          </div>

          <div class="profiler-field">
            <div class="profiler-field-label"><span>Privacy</span></div>
            <div class="profiler-field-value" id="profiler-privacy-value">—</div>
          </div>

          <div class="profiler-field">
            <div class="profiler-field-label"><span>Latency</span></div>
            <div class="profiler-field-value" id="profiler-latency-value">—</div>
          </div>

          <div class="profiler-field">
            <div class="profiler-field-label"><span>Cost</span></div>
            <div class="profiler-field-value" id="profiler-cost-value">—</div>
          </div>

          <ul class="profiler-notes" id="profiler-notes"></ul>

          <div class="profiler-footer" id="profiler-footer">—</div>
        </div>
      </div>
    </header>

    <section class="chat-area" id="chat-area">
      <div class="empty-state" id="empty-state">
        <div class="robot-avatar robot-large" id="empty-state-avatar" data-tier="local" aria-hidden="true">
          <svg viewBox="0 0 40 40">
            <rect class="rb-face-outer" x="3" y="3" width="34" height="34" rx="10"/>
            <rect class="rb-face-inner" x="7" y="7" width="26" height="26" rx="7"/>
            <g class="rb-eye-wrap">
              <rect class="rb-eye rb-eye-l" x="13" y="17" width="5" height="9" rx="2.5"/>
            </g>
            <g class="rb-eye-wrap">
              <rect class="rb-eye rb-eye-r" x="22" y="17" width="5" height="9" rx="2.5"/>
            </g>
          </svg>
        </div>
        <h1>How can I help you today?</h1>
        <p class="empty-state-hint" id="empty-state-hint">Connecting to the router…</p>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <form class="composer" id="composer">
      <div class="composer-stack">
        <div class="attachment-preview" id="attachment-preview" hidden>
          <img id="attachment-thumb" alt="Attached image preview">
          <div class="attachment-meta">
            <span id="attachment-name">image</span>
            <span class="attachment-hint">stays on this device — the cloud tier has no vision model</span>
          </div>
          <button type="button" id="attachment-remove" aria-label="Remove attached image">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="composer-inner">
          <!-- The image-attach input stays without a visible button: the
               router's image path is unchanged and setAttachment() still
               works, there is simply no entry point in the composer for it. -->
          <input type="file" id="attach-input" accept="image/png,image/jpeg,image/webp" hidden>
          <textarea id="composer-input" placeholder="Message Two-Brain..." rows="1"></textarea>
          <button type="button" id="voice-btn" aria-pressed="false" aria-label="Dictate" title="Dictate a message">
            <svg viewBox="0 0 20 20" width="17" height="17" fill="none"><rect x="7.5" y="2.5" width="5" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 9a5.5 5.5 0 0 0 11 0M10 14.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button type="submit" id="send-btn" disabled aria-label="Send message">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none"><path d="M10 16V4M10 4l5 5M10 4l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <!-- Replaces the input row while recording, the way ChatGPT's
             dictation does: waveform, elapsed timer, discard, insert. The
             transcript is deliberately not shown until you confirm. -->
        <div class="dictation" id="dictation" hidden>
          <button type="button" class="dictation-btn dictation-cancel" id="dictation-cancel" aria-label="Discard dictation" title="Discard (Esc)">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <div class="dictation-wave" id="dictation-wave" aria-hidden="true"></div>
          <span class="dictation-time" id="dictation-time">0:00</span>
          <button type="button" class="dictation-btn dictation-confirm" id="dictation-confirm" aria-label="Insert transcript" title="Insert transcript (Enter)">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="dictation-error" id="dictation-error" role="status"></div>
      </div>
    </form>
  </main>
</div>

<template id="robot-svg-template">
  <svg viewBox="0 0 40 40">
    <rect class="rb-face-outer" x="3" y="3" width="34" height="34" rx="10"/>
    <rect class="rb-face-inner" x="7" y="7" width="26" height="26" rx="7"/>
    <g class="rb-eye-wrap">
      <rect class="rb-eye rb-eye-l" x="13" y="17" width="5" height="9" rx="2.5"/>
    </g>
    <g class="rb-eye-wrap">
      <rect class="rb-eye rb-eye-r" x="22" y="17" width="5" height="9" rx="2.5"/>
    </g>
  </svg>
</template>

<script src="markdown.js"></script>
<script src="profiler.js"></script>
<script src="app.js"></script>
</body>
</html>
